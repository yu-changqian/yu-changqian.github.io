# Research Vision & Hiring — displayed on homepage
hiring:
  active: true
  email: "y-changqian@outlook.com"
  intro:
    en: "At **Kling Image**, we believe the next leap in visual intelligence comes from dissolving the boundary between perception, reasoning, and synthesis — scaling unified foundation models that don't just render pixels, but understand and act in the visual world."
    zh: "在 **可灵图像（Kling Image）**，我们相信下一代视觉智能的范式跃迁来自感知、推理与生成的深度统一——构建不仅能渲染高保真像素，更能理解物理规律并在视觉世界中推理与行动的基础模型。"
  directions:
    - title:
        en: "Unified Understanding & Generation"
        zh: "理解生成一体化"
      desc:
        en: "Co-designing autoregressive reasoning and flow/diffusion synthesis in a single architecture where deep comprehension sharpens controllable creation."
        zh: "在统一多模态架构中协同自回归推理与扩散/流匹配生成，让深层语义理解反哺复杂受控创作。"
    - title:
        en: "Visual Tokenizers & Representation"
        zh: "视觉分词器与表征学习"
      desc:
        en: "Building high-compression, semantically aligned 1D/2D visual tokenizers (sparse routing & stable quantization) to unlock scaling laws."
        zh: "探索高压缩率、强语义对齐的新一代视觉 Tokenizer（稀疏专家路由与稳定量化），打通重建保真与生成扩展上限。"
    - title:
        en: "Visual Agentic Intelligence"
        zh: "视觉智能体与推理后训练"
      desc:
        en: "Advancing rubric-grounded RL, self-evolving post-training, and tool-augmented visual agents capable of planning, critique, and refinement."
        zh: "推进结构化奖励强化学习（RL）与自进化后训练，赋予模型多步规划、缺陷定位与自主迭代修正的智能体能力。"
    - title:
        en: "Multimodal Data & Scaling Infra"
        zh: "多模态数据与大规模基建"
      desc:
        en: "Engineering aesthetic- and knowledge-dense data engines alongside ultra-large Sparse MoE training and low-latency inference systems."
        zh: "构建高审美、知识密集型多模态数据引擎，研发超大规模稀疏 MoE 训练与极致低延迟推理基建。"
  cta:
    en: "We are hiring Research Scientists, Multimodal Engineers, and Research Interns (PhD/MS) year-round."
    zh: "长期招募全职研究员、多模态算法工程师及优秀研究实习生（硕/博），欢迎直接邮件交流："

