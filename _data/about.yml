bio:
  en:
    - "I lead **[Kling Image](https://app.klingai.com/cn/omni/new)** at Kuaishou Technology, overseeing all image foundation models powering Kling AI's visual generation and understanding products. My research focuses on **Diffusion Models**, **Vision-Language Models**, and making AI see, think, and create. PhD from [HUST](http://english.hust.edu.cn/) (**🏆 CSIG Top-10 Dissertation Award**), **Stanford's Top 2% Scientists (3 consecutive years)**."
  zh:
    - "我在快手可灵AI负责 **图像模型中心**，统筹可灵AI全部图像基础模型的研发。研究方向聚焦 **Diffusion 模型**和**视觉语言模型**。[华中科技大学](http://www.hust.edu.cn/)博士（🏆 CSIG 全国优博），连续三年斯坦福全球前 2% 顶尖科学家。"

