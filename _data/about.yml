name:
  en: "Changqian Yu"
  zh: "余昌黔"

photo: "/assets/img/bio_pic.jpg"

title:
  en: "Director of Kling Image · Kling AI"
  zh: "可灵AI · 图像模型中心负责人"

tagline:
  en: "I build multimodal AI that sees, understands, and creates."
  zh: "构建能看、能懂、能创造的多模态 AI。"

bio:
  en:
    - "I lead **[Kling Image](https://app.klingai.com/cn/omni/new)** at Kling AI, building foundation models for visual generation and understanding. My research spans **Diffusion Models**, **Vision-Language Models**, and unified multimodal intelligence. I received my PhD from [HUST](http://english.hust.edu.cn/) and was recognized with the **CSIG Top-10 Dissertation Award** and as one of **Stanford's Top 2% Scientists** for three consecutive years."
  zh:
    - "我在可灵AI负责 **图像模型中心**，构建视觉生成与理解基础模型。研究方向涵盖 **Diffusion 模型**、**视觉语言模型**与理解生成一体化。[华中科技大学](http://www.hust.edu.cn/)博士，获 **CSIG 全国优博**，连续三年入选**斯坦福全球前 2% 顶尖科学家**。"

