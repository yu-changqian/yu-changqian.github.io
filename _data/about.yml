# Signature models across Changqian's career — rendered as a dedicated showcase on homepage
signature_models:
  - name: "Kling Image 4.0"
    badge:
      en: "Launched · Nov 2026"
      zh: "正式上线 · 2026.11"
    domain:
      en: "Unified Understanding & Generation · Kling AI"
      zh: "原生理解生成统一架构 · 可灵AI"
    url: "https://klingai.com/release-note/release-notes/Kling_Image_4?type=dialog"
    featured: true
    summary:
      en: "Kling AI's flagship visual foundation model built on a **single-Transformer unified understanding-and-generation architecture** — moving beyond stitched LLM-plus-diffusion pipelines to fuse world knowledge, structured visual grammar (**15K-token** prompts, up to **10 references**), and a **native Agentic visual hub** in one context. Delivers **native 8K** photorealism, **2,000-character** multilingual typography (70+ fonts), **10-shot coherent series**, and layered long-canvas design. Ranked **#1 among Chinese labs** on both Artificial Analysis leaderboards (**+255 / +229 Elo** generational leap over 3.0 Omni)."
      zh: "可灵全新一代**原生理解生成统一架构**图像基座模型——告别传统“语言模型拼接扩散模型”的割裂范式，以单一 Transformer 熔铸世界知识、**15K 超长上下文**（支持 **10 图参考**）与**原生 Agentic 视觉中枢**。支持 **原生 8K** 超高清直出、单图 **2,000 字**多语种排版（70+ 款字体）、单次 **10 张连贯组图**与长图分图层编辑；在 Artificial Analysis 文生图与图像编辑双榜稳居**国内第 1**，较 3.0 Omni 实现 **+255 / +229 Elo** 的代际跨越。"
    capabilities:
