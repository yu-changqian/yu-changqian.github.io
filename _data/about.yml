        en: "Led the **Kling-Image-Omni** team, shipping products that power visual generation and understanding at scale. Key launches include [**Kling-Image-O1**](https://app.klingai.com/cn/release-notes/exv6o36sxa?type=dialog) — bringing visual reasoning to image generation — and [**Kling-Image 3.0 & 3.0 Omni**](https://app.klingai.com/cn/release-notes/rz3idhopum?type=dialog), the latest generation of Kling AI's omni-image foundation models."
        zh: "带领 **Kling-Image-Omni** 团队，构建大规模视觉生成与理解产品。核心交付包括 [**Kling-Image-O1**](https://app.klingai.com/cn/release-notes/exv6o36sxa?type=dialog)——将视觉推理引入图像生成，以及 [**Kling-Image 3.0 & 3.0 Omni**](https://app.klingai.com/cn/release-notes/rz3idhopum?type=dialog)，可灵AI最新一代图像基础模型。"

  - company:
      en: "Kunlun Tech (Skywork)"
      zh: "昆仑万维（天工）"
    period: "2023 – 2025"
    logo: "/assets/img/logos/skywork.jpg"
    logo_alt: "Kunlun/Skywork"
    en: "Led multimodal AI research. Shipped **Skywork-VL-32B**, a vision-language model integrating vision encoders with large language models, and built the storyboard generation model powering cinematic shot planning in [**SkyReels**](https://github.com/SkyworkAI/SkyReels-V1). Also built a scalable Diffusion training pipeline (MoE) for text-to-image generation."
    zh: "主导多模态 AI 研究。交付了 **Skywork-VL-32B** 视觉语言模型，以及 [**SkyReels**](https://github.com/SkyworkAI/SkyReels-V1) 中的分镜生成大模型，驱动影视级镜头规划。同时构建了可扩展的 Diffusion（MoE）训练流水线，支持文生图。"

  - company:
      en: "Meituan"
      zh: "美团"
    period: "2021 – 2023"
    logo: "/assets/img/logos/meituan.png"
    logo_alt: "Meituan"
    en: "Research Scientist at the Autonomous Delivery Department, developing trajectory prediction and motion planning models for the autonomous delivery fleet. The transformer-based prediction model was deployed on real vehicles serving millions of orders."
    zh: "自动配送部研究科学家，为自动配送车队开发轨迹预测和运动规划模型。提出的基于 Transformer 的预测模型部署在真实配送车上，服务百万级订单。"

  - company:
      en: "Huazhong University of Science and Technology"
      zh: "华中科技大学"
    period: "2016 – 2021"
    logo: "/assets/img/logos/hust.svg"
    logo_alt: "HUST"
    en: "PhD focusing on semantic and panoptic segmentation. Won **1st place** in the COCO & Mapillary Panoptic Segmentation Challenge 2018 at ECCV. Built [TorchSeg](https://github.com/ycszen/TorchSeg), a widely-used PyTorch segmentation codebase (2 000+ GitHub stars). Visiting student at the **University of Adelaide**. Interned at **Microsoft Research Asia** (Stars of Tomorrow) and **Megvii (Face++) Research**."
    zh: "博士，研究方向为语义分割与全景分割。在 ECCV 2018 的 COCO & Mapillary 全景分割挑战赛中获得**第一名**。创建了 [TorchSeg](https://github.com/ycszen/TorchSeg)（2000+ GitHub star）。赴**阿德莱德大学**联合培养。在**微软亚洲研究院**（明日之星）和**旷视科技**实习。"

