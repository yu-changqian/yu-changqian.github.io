title:
  en: "Director of Kling Image · Kling AI"
  zh: "可灵AI · 图像模型中心负责人"

tagline:
  en: "Building visual foundation models that perceive, reason, and create — in a unified architecture."
  zh: "打造能感知、会推理、善创造的新一代视觉基础模型。"

bio:
  en:
    - "I lead **[Kling Image](https://app.klingai.com/en/omni/new)** at Kling AI, architecting foundation models across visual generation, editing, and multimodal understanding. From pioneering real-time vision backbones (**BiSeNet**, **Lite-HRNet**) to scaling frontier multimodal systems (**Kling Image 4.0**, **SkyReels**), my work bridges foundational architecture design and global-scale products. PhD from [HUST](https://english.hust.edu.cn/) · **CSIG Top-10 Dissertation Award** · **Stanford's Top 2% Scientist**."
  zh:
    - "我在可灵AI负责 **图像模型中心**，统筹视觉生成、编辑与多模态理解基座模型的研发与落地。从定义实时视觉经典架构（**BiSeNet**、**Lite-HRNet**）到打造全球第一梯队多模态生成系统（**Kling Image 4.0**、**SkyReels**），致力于将原创架构研究转化为亿级用户产品。[华中科技大学](https://www.hust.edu.cn/)博士，获 **CSIG 全国优博** 与**中国电子学会自然科学二等奖**。"

