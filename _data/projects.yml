    en: "Author"
    zh: "作者"
  description:
    en: "FluxMusic — a text-to-music generation model built on rectified flow transformers. Explores the application of Diffusion/Flow Matching architectures beyond images to the audio-music domain."
    zh: "FluxMusic — 基于 rectified flow transformers 的文本转音乐生成模型。将 Diffusion/Flow Matching 架构从图像扩展到音频-音乐领域。"
  highlights:
    - en: "First work applying rectified flow transformers to text-to-music generation"
      zh: "首个将 rectified flow transformers 应用于文本转音乐生成的工作"
