    - en: "Released model weights and inference code to the community"
      zh: "向社区开源了模型权重和推理代码"
  tags: ["Music Generation", "Diffusion", "Flow Matching"]
  links:
    paper: "https://arxiv.org/abs/2409.00587"
    code: "https://github.com/feizc/FluxMusic"

