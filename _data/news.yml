- year: "2026.11"
  en: 'Officially launched <a href="https://klingai.com/release-note/release-notes/Kling_Image_4?type=dialog" target="_blank" rel="noopener"><strong>Kling Image 4.0</strong></a> — a unified understanding-and-generation foundation model with native 8K synthesis, 15K-token control, and coherent 10-shot series, ranking <strong>#1 among Chinese labs</strong> on both Artificial Analysis <a href="https://artificialanalysis.ai/image/leaderboard/editing" target="_blank" rel="noopener">Image Editing</a> (#6 Global, 1183 Elo) and <a href="https://artificialanalysis.ai/image/leaderboard/text-to-image" target="_blank" rel="noopener">Text-to-Image</a> (#7 Global, 1180 Elo).'
  zh: '<a href="https://klingai.com/release-note/release-notes/Kling_Image_4?type=dialog" target="_blank" rel="noopener"><strong>Kling Image 4.0</strong></a> 正式上线——全新原生理解生成统一架构，支持原生 8K 直出、15K 超长语义与连贯组图，在 Artificial Analysis <a href="https://artificialanalysis.ai/image/leaderboard/editing" target="_blank" rel="noopener">图像编辑</a>（全球 #6，1183 Elo）与 <a href="https://artificialanalysis.ai/image/leaderboard/text-to-image" target="_blank" rel="noopener">文生图</a>（全球 #7，1180 Elo）双榜稳居<strong>国内第 1</strong>。'

- year: "2026.09"
  en: 'Three papers accepted to <strong>NeurIPS 2026</strong>: <em>LongBanana</em>, <em>StableVQ</em>, and <em>Structured Defect Grounding</em>.'
  zh: '三篇论文被 <strong>NeurIPS 2026</strong> 接收：<em>LongBanana</em>、<em>StableVQ</em> 与 <em>Structured Defect Grounding</em>。'

- year: 2025
  en: 'Received the <a href="https://www.cie.org.cn/list_43/15597.html"><strong>Second Prize in Natural Science of the Science and Technology Award</strong> from the Chinese Institute of Electronics (CIE)</a>.'
  zh: '荣获 <a href="https://www.cie.org.cn/list_43/15597.html">中国电子学会科学技术奖——<strong>自然科学奖二等奖</strong></a>'

