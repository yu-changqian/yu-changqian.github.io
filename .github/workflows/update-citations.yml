name: Update Publications and Citations

on:
  schedule:
    - cron: "0 6 1 * *" # 1st of each month at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml requests scholarly

      - name: Sync publications from Google Scholar
        run: python scripts/sync_publications_from_scholar.py --scholar-id Hv-vj2sAAAAJ
        continue-on-error: true

      - name: Update citation counts for selected publications
        run: python scripts/update_citations.py

      - name: Commit and push if changed
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/publications.yml _data/publications_all.yml _data/scholar_stats.yml
          git commit -m "chore: sync publications and update citation counts [automated]"
          git push
