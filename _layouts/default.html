<!DOCTYPE html>
{% assign lang = page.lang | default: "en" %}
{% assign t = site.data.i18n[lang] %}
<html lang="{{ page.lang | default: 'en' }}">
  <head>
    {% include head.html %}
  </head>
  <body>
    <a href="#main-content" class="skip-link">{{ t.a11y.skip_to_content }}</a>
    {% include nav.html %}
    <main id="main-content">
      {{ content }}
    </main>
    {% include footer.html %}
    <button class="back-to-top" id="back-to-top" aria-label="{{ t.a11y.back_to_top }}">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
    </button>
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  </body>
</html>
